[project]
name = "shuttle-bus-status"
version = "0.0.1"
description = "Shuttle bus status + camera plate detection (mono-repo meta package)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MPL-2.0" }
authors = [{ name = "Dmitry Ledentsov" }]

# This repo is a mono-repo. We model it as a small "meta" package that depends on
# the two real local packages.
dependencies = [
    "camera-plate-detection>=0.0.1,<0.1.0",
    "shuttle-bus-status-server>=0.0.1,<0.1.0",
]

[project.optional-dependencies]
dev = [
    "camera-plate-detection[dev]>=0.0.1,<0.1.0",
    "shuttle-bus-status-server[dev]>=0.0.1,<0.1.0",
]
dataset = [
    "camera-plate-detection[dataset]>=0.0.1,<0.1.0",
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shuttle_bus_status"]

[tool.uv]
# Ensure the lockfile works across our supported platforms.
# Otherwise, uv may lock against piwheels' Linux ARM artifacts and fail on macOS.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# Primary index
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
# Not setting explicit=true allows piwheels to be used as fallback on ARM Linux automatically

[tool.uv.sources]
camera-plate-detection = { path = "camera" }
shuttle-bus-status-server = { path = "server" }

