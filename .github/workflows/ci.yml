name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (with caching)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            camera/pyproject.toml

      - name: Setup project (installs system dependencies and Python packages)
        run: |
          ./scripts/setup.sh

      - name: Run all checks (formatting, linting, type checking, tests)
        run: |
          ./scripts/test.sh

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup project (installs system dependencies and Python packages)
        run: |
          ./scripts/setup.sh

      - name: Build package
        run: |
          cd camera
          if [ -d "../.venv" ]; then
            source ../.venv/bin/activate
          fi
          pip install build
          python -m build

      - name: Check built package
        run: |
          if [ -d ".venv" ]; then
            source .venv/bin/activate
          fi
          pip install camera/dist/*.whl
