# Configuration for shuttle bus status project
# Both server and camera components can use this file

[camera]
# Camera device path. Use "auto" for automatic detection of the first available video device,
# or specify a specific path like "/dev/video0"
# 
# IMPORTANT: "auto" will prefer real cameras over test devices. Test devices are only
# used as fallback when no real camera is available.
#
# For test camera device, use "test:<directory>" format, e.g.:
# device = "test:data/test_camera"  # Test camera (cycles through images)
# device = "auto"
# device = "test:data/test_camera"
# device = "test:data/test_images/german_plates/kaggle"
# device = "test:data/test_images/german_plates/roboflow/german-license-plates-7/train/images"
device = "test:data/test_images/german_plates/roboflow/german-license-plates-7/test/images"

# Test camera device configuration (only used when device starts with "test:")
[test_camera]
# Minimum cycles to linger on each image (number of read() calls before switching)
# Each cycle = one read() call = one detection attempt
min_duration_seconds = 1.0  # Interpreted as cycles, not seconds

# Maximum cycles to linger on each image (number of read() calls before switching)
max_duration_seconds = 15.0  # Interpreted as cycles, not seconds

# Camera resolution. Use "auto" to use camera's default/native resolution,
# or specify width and height in pixels (e.g., 1920, 1080)
width = 1920
height = 1080

# Requested camera capture FPS (this is NOT the sampling rate).
# Sampling rate is controlled by `plate_detection.poll_interval_seconds`.
capture_fps = 30

# Input format (mjpeg, yuyv, etc.). Leave empty for auto-detection
input_format = ""

[plate_detection]
# YOLOv8 model to use (nano, small, medium, large, xlarge)
# nano is fastest but less accurate, xlarge is most accurate but slowest
model_size = "nano"

# Confidence threshold for plate detection (0.0 to 1.0)
confidence_threshold = 0.5

# Detection polling interval in seconds
poll_interval_seconds = 1.0

[plate_recognition]
# OCR engine(s): single engine string or array for ensemble
# Options: "easyocr", "paddleocr", "tesseract", "dotsocr", "chandra"
# Example for ensemble: ocr_engine = ["dotsocr", "chandra", "easyocr"]
ocr_engine = "easyocr"

# Languages for OCR (German is required, add others if needed)
languages = ["de", "en"]

# Minimum confidence for OCR text recognition (0.0 to 1.0)
# Lower threshold allows more detections but may include false positives
# With multiple preprocessing strategies, can be lower as best result is selected
min_confidence = 0.1

# Optional OCR improvements (toggle on/off):
# - preprocess: DISABLED - Test results show no accuracy improvement, and it slows processing 5-10x
#   If enabled, uses adaptive preprocessing (tries 3-8 strategies based on image size, picks best)
#   Strategies: original, upscale+CLAHE+threshold, to_zero_180, morphological, Otsu, flatten, smooth_sharpen, remove_vignette
# - allowlist: restrict OCR to A-Z and digits (reduces garbage characters)
# - normalize: normalize output (uppercase, strip separators)
# - character_correction: Apply position-based character correction (O→0, I→1, etc.)
preprocess = false  # DISABLED: Test results show no accuracy improvement. Keep disabled for speed (0.5-2s vs 5-15s).
allowlist = true
allowlist_chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
normalize = true

[debouncing]
# Number of detections required before a plate is considered "appeared"
appearance_min_count = 3

# Time window in seconds for appearance detection
appearance_window_seconds = 2.0

# Time in seconds a plate must be absent before it's considered "disappeared"
disappearance_timeout_seconds = 5.0

[logging]
# Where to log plate events (privacy-sensitive): "file" | "console" | "no"
log_plates = "file"

# Log file path (relative to project root or absolute)
log_file = "logs/plates.log"

# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = "INFO"

# Whether to also log to stdout
log_to_console = true

[server]
# Server host address
host = "0.0.0.0"

# Server port
port = 8001

# Whether to enable debug mode
debug = false

[public_server]
# Public server configuration (not yet implemented)
# This will be a separate server for public access

# Server host address
host = "0.0.0.0"

# Server port
port = 8000

# Whether to enable debug mode
debug = false
