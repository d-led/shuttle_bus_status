[project]
name = "shuttle-bus-status-server"
version = "0.0.1"
description = "Server for shuttle bus status monitoring with live view"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MPL-2.0"}
authors = [
    {name = "Dmitry Ledentsov"}
]
keywords = ["shuttle-bus", "status", "monitoring", "liveview", "pyview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyview-web>=0.8.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.6.0",
    "opencv-python>=4.10.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-archon>=0.0.7",
    "black>=25.12.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "radon>=6.0.0",
    "vulture>=2.14",
]

[project.scripts]
shuttle-bus-status-server = "server.main:main"
shuttle-bus-status-camera-server = "server.main:main_camera"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "SIM", "ARG", "PIE", "PT", "RET", "TCH", "TID", "Q", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pyview.*",
    "starlette.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=server --cov-report=term-missing --cov-report=html"
markers = [
    "integration: marks tests as integration tests that require server access (deselect with '-m \"not integration\"')",
]

[tool.uv]
# Configure piwheels.org as a fallback index for ARM Linux (Raspberry Pi)
# piwheels provides pre-built wheels for ARM architectures, avoiding compilation
# Without explicit=true, uv will automatically use piwheels as a fallback when PyPI doesn't have ARM wheels
# This works out of the box - no special cases needed!
# !!!DO NOT REMOVE THIS!!!
# Ensure the lockfile works across our supported platforms.
# Otherwise, uv may lock against piwheels' Linux ARM artifacts and fail on macOS.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# Primary index
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
# Not setting explicit=true allows piwheels to be used as fallback on ARM Linux automatically
