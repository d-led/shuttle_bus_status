<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <title>{{ title }}</title>
  <meta charset="UTF-8" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <!-- Viewport meta tag to prevent zooming on iOS devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Minimal DaisyUI for theme support only -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  {{ css_vars_markup }}
  <script>
    // Server connection status indicator (phx events).
    // Inspired by MVG's connection status handling, but deliberately minimal.
    (function () {
      let state = "connecting"; // connecting | connected | unstable | broken

      function setState(next) {
        state = next;
        const el = document.getElementById("server-connection-status");
        if (!el) return;

        el.setAttribute("data-connection-state", state);

        const connectedIcon = document.getElementById("server-connected-icon");
        const disconnectedIcon = document.getElementById("server-disconnected-icon");
        const connectingIcon = document.getElementById("server-connecting-icon");
        const unstableIcon = document.getElementById("server-unstable-icon");

        if (!connectedIcon || !disconnectedIcon || !connectingIcon || !unstableIcon) return;

        connectedIcon.style.display = "none";
        disconnectedIcon.style.display = "none";
        connectingIcon.style.display = "none";
        unstableIcon.style.display = "none";

        if (state === "connected") connectedIcon.style.display = "";
        else if (state === "unstable") unstableIcon.style.display = "";
        else if (state === "broken") disconnectedIcon.style.display = "";
        else connectingIcon.style.display = "";
      }

      // Initial paint once DOM is ready.
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          setState("connecting");
        });
      } else {
        setState("connecting");
      }

      window.addEventListener("phx:connecting", () => setState("connecting"));
      window.addEventListener("phx:open", () => setState("connected"));
      window.addEventListener("phx:update", () => setState("connected"));
      window.addEventListener("phx:disconnect", () => setState("broken"));
      window.addEventListener("phx:close", () => setState("broken"));
      window.addEventListener("phx:error", () => setState("unstable"));
    })();
  </script>
  <script defer type="text/javascript" src="/static/assets/app.js"></script>
  {% for el in additional_head_elements %}
    {{ el }}
  {% endfor %}
</head>
<body>
  {{ main_content }}
</body>
</html>
