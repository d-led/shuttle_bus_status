<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <title>{{ title }}</title>
  <meta charset="UTF-8" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <!-- Viewport meta tag to prevent zooming on iOS devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Minimal DaisyUI for theme support only -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  {{ css_vars_markup }}
  <script>
    // Server connection status hook using proper Phoenix LiveView hooks
    (function () {
      // Define the connection status hook
      const ConnectionStatusHook = {
        mounted() {
          this.el.setAttribute("data-connection-state", "connecting");
          this.updateIcons("connecting");
          
          // Find the LiveView container to listen to its events
          // Events are fired on the container with data-phx-main="true"
          const liveViewContainer = this.el.closest('[data-phx-main="true"]');
          if (!liveViewContainer) {
            console.warn("ConnectionStatus hook: LiveView container not found");
            return;
          }
          
          // Store reference to container for cleanup
          this.liveViewContainer = liveViewContainer;
          
          // Listen to LiveView socket events on the container
          // These events are fired by Phoenix LiveView's JavaScript client
          this.handleConnecting = () => {
            this.setConnectionState("connecting");
          };
          this.handleOpen = () => {
            this.setConnectionState("connected");
          };
          this.handleDisconnect = () => {
            this.setConnectionState("broken");
          };
          this.handleClose = () => {
            this.setConnectionState("broken");
          };
          this.handleError = () => {
            this.setConnectionState("unstable");
          };
          
          liveViewContainer.addEventListener("phx:connecting", this.handleConnecting);
          liveViewContainer.addEventListener("phx:open", this.handleOpen);
          liveViewContainer.addEventListener("phx:disconnect", this.handleDisconnect);
          liveViewContainer.addEventListener("phx:close", this.handleClose);
          liveViewContainer.addEventListener("phx:error", this.handleError);
        },
        
        destroyed() {
          // Clean up event listeners
          if (this.liveViewContainer) {
            this.liveViewContainer.removeEventListener("phx:connecting", this.handleConnecting);
            this.liveViewContainer.removeEventListener("phx:open", this.handleOpen);
            this.liveViewContainer.removeEventListener("phx:disconnect", this.handleDisconnect);
            this.liveViewContainer.removeEventListener("phx:close", this.handleClose);
            this.liveViewContainer.removeEventListener("phx:error", this.handleError);
          }
        },
        
        setConnectionState(state) {
          this.el.setAttribute("data-connection-state", state);
          this.updateIcons(state);
        },
        
        updateIcons(state) {
          const connectedIcon = document.getElementById("server-connected-icon");
          const disconnectedIcon = document.getElementById("server-disconnected-icon");
          const connectingIcon = document.getElementById("server-connecting-icon");
          const unstableIcon = document.getElementById("server-unstable-icon");

          if (!connectedIcon || !disconnectedIcon || !connectingIcon || !unstableIcon) return;

          connectedIcon.style.display = "none";
          disconnectedIcon.style.display = "none";
          connectingIcon.style.display = "none";
          unstableIcon.style.display = "none";

          if (state === "connected") connectedIcon.style.display = "";
          else if (state === "unstable") unstableIcon.style.display = "";
          else if (state === "broken") disconnectedIcon.style.display = "";
          else connectingIcon.style.display = "";
        }
      };

      // Register the hook for PyView's LiveSocket
      // PyView's LiveSocket will pick this up from window.Hooks when it initializes
      if (typeof window !== "undefined") {
        if (!window.Hooks) {
          window.Hooks = {};
        }
        window.Hooks.ConnectionStatus = ConnectionStatusHook;
      }
    })();
  </script>
  <script defer type="text/javascript" src="/static/assets/app.js"></script>
  {% for el in additional_head_elements %}
    {{ el }}
  {% endfor %}
</head>
<body>
  {{ main_content }}
</body>
</html>
